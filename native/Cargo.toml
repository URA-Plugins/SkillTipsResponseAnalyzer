[package]
name = "skill-tips-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "skill_tips_bridge"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
