name: Plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    permissions:
      contents: write
    uses: URA-Plugins/.github/.github/workflows/plugin.yml@927fa76bae243fc22cc6fa4e09a0e4754f096abb
    with:
      project: SkillTipsResponseAnalyzer.csproj
      publish: false

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate the native bridge
        shell: pwsh
        run: ./native/build.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-bridge
          path: native/target/x86_64-pc-windows-msvc/release/skill_tips_bridge.dll
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plugin, native]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: plugin-package
          path: package
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-bridge
          path: package
      - name: Publish the verified plugin and native bridge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @(Get-ChildItem package -File -Filter '*.zip')
          if ($packages.Count -ne 1) { throw 'The verified artifact must contain exactly one plugin ZIP.' }
          $native = Get-Item package/skill_tips_bridge.dll
          $archive = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $reader = [IO.StreamReader]::new($archive.GetEntry('manifest.json').Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          $match = [regex]::Match($env:GITHUB_REF_NAME, '^v(?<version>\d+(?:\.\d+){1,3})(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?$')
          if (-not $match.Success -or [version]$match.Groups['version'].Value -ne [version]$manifest.Version) {
            throw "Release tag $env:GITHUB_REF_NAME must match numeric manifest version $($manifest.Version)."
          }
          $assets = @($packages[0], $native)
          $assets | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content package/SHA256SUMS.txt -Encoding utf8
          $manifest.Changelog | Set-Content release-notes.md
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME) + @($assets.FullName) + @('package/SHA256SUMS.txt', '--verify-tag', '--draft', '--title', $env:GITHUB_REF_NAME, '--notes-file', 'release-notes.md')
          if ($env:GITHUB_REF_NAME.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          gh release edit $env:GITHUB_REF_NAME --draft=false
